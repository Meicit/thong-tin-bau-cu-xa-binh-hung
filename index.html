<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu Khu vực bỏ phiếu Xã Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">

    <header class="bg-red-700 text-white py-8 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 id="title" class="text-2xl md:text-3xl font-bold uppercase mb-2">Đang tải dữ liệu...</h1>
            <p class="opacity-90">Hệ thống thông tin Bầu cử nhiệm kỳ 2026 - 2031</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="mb-6 max-w-xl mx-auto">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="search()" placeholder="Tìm theo khu vực hoặc tên ấp..." 
                    class="w-full pl-10 pr-4 py-3 border rounded-xl shadow-sm focus:ring-2 focus:ring-red-500 outline-none">
            </div>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden border">
            <div class="overflow-x-auto">
                <table class="min-w-full" id="dataTable">
                    <thead class="bg-gray-100">
                        <tr class="text-left text-xs font-bold uppercase tracking-wider text-gray-600">
                            <th class="px-6 py-4 text-center">KVBP</th>
                            <th class="px-6 py-4">Gồm Ấp</th>
                            <th class="px-6 py-4">Địa điểm bỏ phiếu</th>
                            <th class="px-6 py-4 text-right">Cử tri</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200" id="dataRows">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function fetchData() {
            const rows = document.getElementById('dataRows');
            try {
                // Thêm ./ để xác định đúng file cùng thư mục trên GitHub Pages
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error('Không tìm thấy file data.json');
                
                const data = await response.json();
                document.getElementById('title').innerText = data.tieu_de_trang;

                rows.innerHTML = data.danh_sach_khu_vuc.map(item => `
                    <tr class="hover:bg-red-50 transition">
                        <td class="px-6 py-4 text-center font-bold text-red-700">${item.khu_vuc_bo_phieu}</td>
                        <td class="px-6 py-4 text-sm font-medium">${item.gom_ap}</td>
                        <td class="px-6 py-4 text-sm italic text-gray-600">${item.dia_diem_bo_phieu}</td>
                        <td class="px-6 py-4 text-right font-bold text-blue-600">${item.so_luong_cu_tri.toLocaleString('vi-VN')}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error(err);
                rows.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-red-500 font-bold">Lỗi: ${err.message}. <br> Hãy đảm bảo file data.json nằm cùng thư mục với index.html trên GitHub.</td></tr>`;
            }
        }

        function search() {
            let input = document.getElementById("searchInput").value.toUpperCase();
            let tr = document.getElementById("dataRows").getElementsByTagName("tr");
            for (let i = 0; i < tr.length; i++) {
                tr[i].style.display = tr[i].innerText.toUpperCase().includes(input) ? "" : "none";
            }
        }

        window.onload = fetchData;
    </script>
</body>
</html>
