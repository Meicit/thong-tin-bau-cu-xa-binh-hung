<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bầu Cử Xã Bình Hưng 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-red-700 text-white p-4 text-center font-bold text-xl">
        HỆ THỐNG THÔNG TIN BẦU CỬ XÃ BÌNH HƯNG
    </nav>

    <div class="container mx-auto p-4">
        <section class="mb-10">
            <h2 class="text-xl font-bold mb-4">Danh sách Khu vực bỏ phiếu</h2>
            <div class="overflow-x-auto bg-white shadow rounded-lg">
                <table class="min-w-full" id="station-table">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="p-3 text-left">KVBP</th>
                            <th class="p-3 text-left">Ấp</th>
                            <th class="p-3 text-left">Địa điểm</th>
                        </tr>
                    </thead>
                    <tbody id="station-list">
                        </tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold mb-4">Danh sách Ứng cử viên</h2>
            <div id="candidate-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                </div>
        </section>
    </div>

    <script>
        // Hàm lấy dữ liệu từ file JSON
        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();

                // 1. Đổ dữ liệu vào bảng trạm bỏ phiếu
                const stationList = document.getElementById('station-list');
                data.stations.forEach(s => {
                    stationList.innerHTML += `
                        <tr class="border-t">
                            <td class="p-3 font-bold">${s.id}</td>
                            <td class="p-3">${s.ap}</td>
                            <td class="p-3 text-sm">${s.address}</td>
                        </tr>
                    `;
                });

                // 2. Đổ dữ liệu vào danh sách ứng cử viên
                const candidateGrid = document.getElementById('candidate-grid');
                data.candidates.forEach(c => {
                    candidateGrid.innerHTML += `
                        <div class="bg-white p-4 rounded-lg shadow border-l-4 border-red-600">
                            <h3 class="font-bold text-lg uppercase">${c.name}</h3>
                            <p class="text-sm text-gray-600">KVBP: ${c.kvbp}</p>
                            <p class="mt-2 text-xs">${c.position}</p>
                            <button class="mt-3 text-red-600 font-semibold text-sm">Xem chi tiết</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu:", error);
            }
        }

        // Chạy hàm khi trang web tải xong
        window.onload = loadData;
    </script>
</body>
</html>
