<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bầu Cử Xã Bình Hưng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-hover { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-color: #3b82f6; }
        .modal-active { display: flex !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <header class="bg-blue-900 text-white py-14 text-center shadow-lg mb-10">
        <h1 id="headerTitle" class="text-3xl md:text-4xl font-black uppercase tracking-tight">Cổng thông tin bầu cử</h1>
        <div class="w-20 h-1 bg-red-600 mx-auto mt-4 rounded-full"></div>
    </header>

    <main class="container mx-auto px-4 max-w-6xl">
        <div id="feature-cards" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16"></div>

        <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-200">
            <h2 class="text-2xl font-bold mb-8 text-blue-900 flex items-center">
                <i class="fas fa-search-location mr-3"></i> Tra cứu Khu vực bỏ phiếu
            </h2>
            <input type="text" id="search" onkeyup="doSearch()" placeholder="Nhập tên ấp hoặc địa điểm bỏ phiếu..." 
                class="w-full p-5 border-none bg-slate-100 rounded-2xl mb-8 focus:ring-2 focus:ring-blue-500 outline-none shadow-inner">
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-xs uppercase font-bold tracking-widest">
                            <th class="p-4 border-b">Khu vực</th>
                            <th class="p-4 border-b">Thông tin Ấp</th>
                            <th class="p-4 border-b">Địa điểm</th>
                            <th class="p-4 border-b text-right">Cử tri</th>
                        </tr>
                    </thead>
                    <tbody id="content" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="infoModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] max-w-2xl w-full p-10 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-3xl text-slate-300 hover:text-red-500">&times;</button>
            <div id="modalBody"></div>
            <button onclick="closeModal()" class="mt-10 w-full py-4 bg-blue-900 text-white rounded-2xl font-bold uppercase tracking-widest hover:bg-blue-800">Quay lại trang chủ</button>
        </div>
    </div>

    <footer class="py-16 text-center text-slate-400 text-sm">
        <p>© 2026 Ủy ban Bầu cử Xã Bình Hưng. Hệ thống tra cứu thông tin điện tử.</p>
    </footer>

    <script>
        let electionData = {};

        async function init() {
            try {
                const res = await fetch('./data.json?v=' + Date.now());
                if (!res.ok) throw new Error("Lỗi tải dữ liệu");
                electionData = await res.json();
                
                document.getElementById('headerTitle').innerText = electionData.tieu_de_trang;

                // Hiển thị 3 thẻ chức năng
                document.getElementById('feature-cards').innerHTML = electionData.cac_chuc_nang.map(item => `
                    <div onclick="openModal('${item.id}')" class="card-hover cursor-pointer bg-white p-6 rounded-2xl flex flex-col items-center text-center">
                        <div class="${item.mau} text-white w-16 h-16 rounded-2xl flex items-center justify-center shadow-lg mb-4">
                            <i class="fas ${item.icon} text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm leading-tight mb-2 uppercase">${item.tieu_de}</h3>
                        <p class="text-[11px] text-slate-400 font-medium">${item.mo_ta}</p>
                    </div>
                `).join('');

                // Hiển thị danh sách khu vực
                document.getElementById('content').innerHTML = electionData.danh_sach_khu_vuc.map(item => `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-5 font-bold text-blue-900 text-lg">#${item.khu_vuc}</td>
                        <td class="p-5 text-sm font-semibold text-slate-700">Ấp ${item.ap}</td>
                        <td class="p-5 text-sm italic text-slate-500">${item.dia_diem}</td>
                        <td class="p-5 text-sm font-black text-right text-red-600">${item.so_luong.toLocaleString('vi-VN')}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error(err);
                document.body.innerHTML = `<div class="p-20 text-center text-red-600 font-bold">LỖI HỆ THỐNG: ${err.message}</div>`;
            }
        }

        function openModal(id) {
            const item = electionData.cac_chuc_nang.find(x => x.id === id);
            document.getElementById('modalBody').innerHTML = `
                <div class="${item.mau} w-20 h-20 rounded-2xl flex items-center justify-center text-white text-4xl mb-6 shadow-xl">
                    <i class="fas ${item.icon}"></i>
                </div>
                <div class="prose prose-slate max-w-none">
                    ${item.noi_dung_chi_tiet}
                </div>
            `;
            document.getElementById('infoModal').classList.add('modal-active');
        }

        function closeModal() { document.getElementById('infoModal').classList.remove('modal-active'); }

        function doSearch() {
            const q = document.getElementById('search').value.toLowerCase();
            const tr = document.querySelectorAll('#content tr');
            tr.forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
        }

        window.onload = init;
    </script>
</body>
</html>
